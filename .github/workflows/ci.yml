name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e-evidence:
    name: E2E scenarios and evidence
    runs-on: ubuntu-latest
    # Boots the real stack, so it is far slower than the `ci` job above. Gated to pull requests and
    # manual runs rather than every branch push; `ci` stays the fast feedback loop.
    if: github.event_name != 'push'
    # The stack build (two Next apps) plus Keycloak boot dominates; the cap stops a hung stack from
    # burning the 6-hour default.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # scripts/regression/run.ts hardcodes these hostnames (LOCAL, ~line 93) rather than reading
      # them from the environment. lvh.me is a public wildcard onto 127.0.0.1, but pin it locally so
      # the run never depends on the runner's DNS resolving someone else's domain.
      - name: Pin local hostnames
        run: |
          echo "127.0.0.1 lvh.me demo.lvh.me keycloak.lvh.me" | sudo tee -a /etc/hosts
          getent hosts demo.lvh.me keycloak.lvh.me

      - name: Install dependencies
        run: npm ci

      # @playwright/test is already a dependency; only the browser binaries and their system libs
      # are missing on the runner. Both journey projects need them.
      #
      # chromium-headless-shell is named explicitly rather than left to arrive with chromium: the
      # journeys run headless, which uses the separate shell binary, and a repo-local install here
      # was once found holding chromium without it — producing a launch failure that reads as if
      # nothing were installed at all.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # One command: docker compose up --build, Keycloak realm wait, db generate/migrate/seed, and
      # the host-run Ops console. No secrets required — repairLocalEnv() writes .env from defaults.
      - name: Bootstrap the local stack
        run: npm run local:bootstrap

      - name: Run E2E scenarios
        env:
          REGRESSION_CLEANUP_ON_EXIT: "1"
        run: npm run regression:all

      # Journeys drive the real UI and assert at every step; the docs-only project produces the
      # user-guide screenshots. if: always() so a failing regression run still shows how far a real
      # user got — which is usually the most useful thing to know.
      - name: Run journeys
        if: always()
        run: npm run journeys

      # One summary covering the scenario run, the journeys, and the per-process roll-up that ties
      # them together (v0.20.13). Replaces the two separate summary steps, which counted scenarios
      # and journey steps in unrelated blocks with no way to tell whether a given business process
      # was healthy. Same non-throwing contract.
      - name: Write run summary
        if: always()
        run: npm run evidence:summary

      # Renders both evidence layers into one complete PDF per named business process (v0.20.5,
      # merged with the scenario results in v0.20.13), via Playwright's already-installed Chromium.
      # Falls back to one HTML file per process instead of failing the step if no browser is
      # available, so this can never turn a passing run red.
      - name: Write per-process evidence reports
        if: always()
        run: npm run journeys:report:pdf

      # Only useful when the stack itself failed; on success it is noise.
      - name: Collect Docker logs
        if: failure()
        run: |
          mkdir -p .ops/docker-logs
          docker compose logs --no-color --tail 400 > .ops/docker-logs/compose.log 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_number }}
          # The reports lead, since they are what a reviewer actually opens. journey-report/ also
          # carries regression-run.json — the single scenario result the reports were built from,
          # so the artifact no longer globs every run the results directory has ever held.
          path: |
            .ops/journey-report/**
            .ops/journey-results/*.json
            !.ops/journey-results/playwright.json
            .ops/journey-evidence/**/*.png
            .ops/docker-logs/*.log
            docs/user-guides/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

  realm-import:
    name: Validate Keycloak realm import
    runs-on: ubuntu-latest
    # Boots Keycloak against keycloak/import the same way production does
    # (start-dev --import-realm) so a malformed realm JSON — e.g. an unknown
    # ClientRepresentation field — fails CI instead of crash-looping on deploy (D-057).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot Keycloak with the realm import
        run: |
          docker run -d --name kc-realm-check \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -v "$PWD/keycloak/import:/opt/keycloak/data/import:ro" \
            -p 8080:8080 \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm

      - name: Verify the talentos realm imports cleanly
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/talentos/.well-known/openid-configuration >/dev/null 2>&1; then
              ok=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' kc-realm-check 2>/dev/null)" != "true" ]; then
              break
            fi
            sleep 3
          done
          echo "----- Keycloak logs (tail) -----"
          docker logs kc-realm-check 2>&1 | tail -50
          if docker logs kc-realm-check 2>&1 | grep -qiE 'Failed to run import|Unrecognized field|Failed to start server in'; then
            echo "::error::Keycloak realm import failed — see logs above"
            exit 1
          fi
          if [ "$ok" != "1" ]; then
            echo "::error::Keycloak did not become ready / realm 'talentos' not reachable"
            exit 1
          fi
          echo "Realm 'talentos' imported cleanly and is reachable."

      - name: Tear down
        if: always()
        run: docker rm -f kc-realm-check 2>/dev/null || true
